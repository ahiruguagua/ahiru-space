<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ネオンアヒル | あひるスペース</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #07070f;
    overflow: hidden;
    font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #game { display: block; width: 100%; height: 100%; cursor: none; }
  .back-link {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
    z-index: 50; color: #9fd8ff; text-decoration: none; font-size: 13px;
    font-weight: bold; padding: 4px 12px; background: rgba(0,0,0,0.4);
    border-radius: 14px; border: 1px solid rgba(90, 220, 255, 0.25);
  }
  .back-link:hover { color: #ffd75d; }
  #ui {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    pointer-events: none;
    color: #e8f6ff;
    text-align: center;
    z-index: 10;
  }
  .panel {
    background: rgba(10, 12, 28, 0.82);
    border: 1px solid rgba(90, 220, 255, 0.35);
    border-radius: 18px;
    padding: 42px 56px;
    box-shadow: 0 0 60px rgba(60, 180, 255, 0.25), inset 0 0 40px rgba(60,180,255,0.06);
    backdrop-filter: blur(6px);
  }
  @media (max-width: 500px) {
    .panel { padding: 30px 24px; margin: 0 14px; }
    h1 { font-size: 38px !important; }
  }
  h1 {
    font-size: 52px;
    letter-spacing: 6px;
    background: linear-gradient(90deg, #4df0ff, #ffd75d, #ff6bd5);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 10px;
    font-weight: 800;
  }
  .sub { font-size: 15px; color: #9fd8ff; line-height: 1.9; }
  .hint {
    margin-top: 22px;
    font-size: 14px;
    color: #6fe3ff;
    animation: blink 1.4s ease-in-out infinite;
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .hidden { display: none !important; }

  /* ===== Game over / leaderboard overlays ===== */
  .go-overlay, .lb-overlay {
    position: fixed; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(4, 5, 14, 0.7);
    z-index: 20;
  }
  .lb-overlay { z-index: 30; }
  .go-overlay.active, .lb-overlay.active { display: flex; }
  .go-panel, .lb-panel {
    background: rgba(10, 12, 28, 0.95);
    border: 1px solid rgba(90, 220, 255, 0.35);
    border-radius: 18px;
    padding: 28px 34px;
    box-shadow: 0 0 60px rgba(60, 180, 255, 0.25);
    color: #e8f6ff;
    text-align: center;
    max-width: 92vw;
  }
  .go-panel h2, .lb-panel h2 {
    font-size: 26px; margin-bottom: 14px;
    color: #ff6b8d; letter-spacing: 2px;
  }
  .lb-panel h2 { color: #ffd75d; }
  .go-stats { font-size: 17px; line-height: 1.9; margin-bottom: 14px; }
  .go-stats .num { color: #ffd75d; font-weight: bold; }
  .highscore-entry p { font-size: 14px; color: #6fe3ff; margin-bottom: 8px; }
  .highscore-entry input {
    font-size: 16px; padding: 8px 12px; border-radius: 10px;
    border: 1px solid rgba(90, 220, 255, 0.5);
    background: rgba(20, 26, 50, 0.9); color: #fff;
    text-align: center; outline: none; width: 200px;
    margin-bottom: 8px;
  }
  .submitted-msg { color: #7dffa8; font-size: 15px; margin: 10px 0; }
  .go-btn {
    font-size: 15px; font-weight: bold;
    padding: 10px 22px; margin: 6px 4px 0;
    border-radius: 22px; border: none; cursor: pointer;
    font-family: inherit;
  }
  .go-btn.primary { background: linear-gradient(135deg, #ffd75d, #ff9d2e); color: #333; }
  .go-btn.secondary { background: transparent; color: #9fd8ff; border: 2px solid rgba(90, 220, 255, 0.5); }
  .go-btn:hover { filter: brightness(1.15); }
  #lbList {
    max-height: 50vh; overflow-y: auto;
    min-width: 260px; margin-bottom: 12px;
    text-align: left;
  }
  .lb-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; border-radius: 8px;
    font-size: 14px;
  }
  .lb-row.top3 { background: rgba(255, 215, 93, 0.1); }
  .lb-row .rank { width: 34px; text-align: center; }
  .lb-row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-row .score { color: #ffd75d; font-weight: bold; font-variant-numeric: tabular-nums; }
  .lb-empty { color: rgba(232, 246, 255, 0.5); padding: 18px 0; text-align: center; font-size: 14px; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<a href="/" class="back-link">&larr; Home</a>

<div id="ui">
  <div id="title-panel" class="panel">
    <h1>ネオンアヒル</h1>
    <div class="sub">
      マウス（または指）で<span style="color:#ffd75d">あひる</span>を操作。<br>
      赤い敵をよけて、<span style="color:#ffd76b">★スター</span>を集めよう。<br>
      連続で取るとコンボでスコア倍増!
    </div>
    <div class="hint">クリック / タップでスタート</div>
  </div>
</div>

<div class="go-overlay" id="gameoverOverlay">
  <div class="go-panel">
    <h2>ゲームオーバー</h2>
    <div class="go-stats">
      スコア: <span class="num" id="goScore">0</span><br>
      <span style="font-size:14px; color:#9fd8ff;">
        生存 <span id="goTime">0</span>秒 / ★<span id="goStars">0</span> / 最大コンボ x<span id="goCombo">0</span>
      </span>
    </div>
    <div class="highscore-entry" id="hsEntry" style="display:none;">
      <p>ランキング入り！ なまえを入力:</p>
      <input type="text" id="hsName" maxlength="15" placeholder="なまえ" autocomplete="off">
      <br>
      <button class="go-btn primary" id="hsSubmit">とうろく</button>
    </div>
    <div class="submitted-msg" id="hsSubmitted" style="display:none;">とうろくしました！</div>
    <div>
      <button class="go-btn primary" id="goRestart">もういちど</button>
      <button class="go-btn secondary" id="goLeaderboard">ランキング</button>
    </div>
  </div>
</div>

<div class="lb-overlay" id="lbOverlay">
  <div class="lb-panel">
    <h2>ランキング TOP 20</h2>
    <div id="lbList"></div>
    <button class="go-btn secondary" id="lbClose">とじる</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const titlePanel = document.getElementById('title-panel');

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Audio ----------
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function beep(freq, dur, type = 'sine', vol = 0.15, slide = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur);
  }
  const sfx = {
    star(combo) { beep(600 + Math.min(combo, 12) * 70, 0.12, 'triangle', 0.18, 200); },
    hit() { beep(160, 0.35, 'sawtooth', 0.22, -100); beep(90, 0.4, 'square', 0.15, -40); },
    over() { beep(300, 0.5, 'sawtooth', 0.2, -220); },
    start() { beep(440, 0.1, 'triangle', 0.15, 220); setTimeout(() => beep(660, 0.15, 'triangle', 0.15, 220), 90); },
    shield() { beep(880, 0.2, 'sine', 0.16, 300); },
  };

  // ---------- Game state ----------
  const STATE = { TITLE: 0, PLAY: 1, OVER: 2 };
  let state = STATE.TITLE;

  const mouse = { x: W / 2, y: H / 2 };
  const player = { x: W / 2, y: H / 2, r: 11, lives: 3, inv: 0, shield: 0, trail: [], face: 1 };
  let enemies = [], stars = [], particles = [], powerups = [], bgStars = [];
  let score = 0, combo = 0, comboTimer = 0, elapsed = 0, spawnTimer = 0, starTimer = 0, powerTimer = 0;
  let starsCollected = 0, maxCombo = 0;
  let shake = 0, flash = 0;
  let best = 0;
  try { best = +localStorage.getItem('neon-duck-best') || 0; } catch (e) {}

  for (let i = 0; i < 90; i++) {
    bgStars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.6 + 0.4, v: Math.random() * 12 + 4 });
  }

  function reset() {
    enemies = []; stars = []; particles = []; powerups = [];
    score = 0; combo = 0; comboTimer = 0; elapsed = 0;
    spawnTimer = 0; starTimer = 0; powerTimer = 0;
    starsCollected = 0; maxCombo = 0;
    player.x = mouse.x = W / 2; player.y = mouse.y = H / 2;
    player.lives = 3; player.inv = 0; player.shield = 0; player.trail = []; player.face = 1;
  }

  // ---------- Leaderboard ----------
  const API = '/api/scores?game=dodge';
  let leaderboard = [];
  let scoreSubmitted = false;

  async function fetchLeaderboard() {
    try {
      const res = await fetch(API);
      if (res.ok) leaderboard = await res.json();
    } catch (e) {}
  }

  async function submitScore(name, sc) {
    try {
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name,
          score: sc,
          stars: starsCollected,
          maxCombo,
          time: Math.round(elapsed * 10) / 10,
        })
      });
      if (res.ok) {
        leaderboard = await res.json();
        scoreSubmitted = true;
      }
    } catch (e) {}
  }

  function isHighScore(sc) {
    if (leaderboard.length < 20) return sc > 0;
    return sc > leaderboard[leaderboard.length - 1].score;
  }

  function showLeaderboard() {
    const list = document.getElementById('lbList');
    if (leaderboard.length === 0) {
      list.innerHTML = '<div class="lb-empty">まだスコアがありません</div>';
    } else {
      list.innerHTML = leaderboard.slice(0, 20).map((e, i) => {
        const medal = i === 0 ? '👑' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}.`;
        const extra = (e.stars ? ` ★${e.stars}` : '') + (e.maxCombo ? ` x${e.maxCombo}` : '');
        return `<div class="lb-row ${i < 3 ? 'top3' : ''}"><span class="rank">${medal}</span><span class="name">${escapeHtml(e.name)}</span><span class="score">${e.score.toLocaleString()}${extra}</span></div>`;
      }).join('');
    }
    document.getElementById('lbOverlay').classList.add('active');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  fetchLeaderboard();

  // ---------- Input ----------
  function setMouse(e) {
    const p = e.touches ? e.touches[0] : e;
    mouse.x = p.clientX; mouse.y = p.clientY;
  }
  window.addEventListener('mousemove', setMouse);
  window.addEventListener('touchmove', (e) => { e.preventDefault(); setMouse(e); }, { passive: false });
  window.addEventListener('touchstart', setMouse, { passive: true });

  function startGame() {
    ensureAudio();
    reset();
    state = STATE.PLAY;
    scoreSubmitted = false;
    titlePanel.classList.add('hidden');
    document.getElementById('gameoverOverlay').classList.remove('active');
    document.getElementById('lbOverlay').classList.remove('active');
    sfx.start();
  }
  window.addEventListener('mousedown', () => { if (state === STATE.TITLE) startGame(); });
  window.addEventListener('touchend', () => { if (state === STATE.TITLE) startGame(); });

  document.getElementById('goRestart').addEventListener('click', startGame);
  document.getElementById('goLeaderboard').addEventListener('click', showLeaderboard);
  document.getElementById('lbClose').addEventListener('click', () => {
    document.getElementById('lbOverlay').classList.remove('active');
  });
  document.getElementById('hsSubmit').addEventListener('click', doSubmit);
  document.getElementById('hsName').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doSubmit();
  });

  async function doSubmit() {
    if (scoreSubmitted) return;
    const name = document.getElementById('hsName').value.trim();
    if (!name) return;
    document.getElementById('hsSubmit').disabled = true;
    await submitScore(name, Math.floor(score));
    document.getElementById('hsSubmit').disabled = false;
    if (scoreSubmitted) {
      document.getElementById('hsEntry').style.display = 'none';
      document.getElementById('hsSubmitted').style.display = 'block';
      try { localStorage.setItem('neon-duck-name', name); } catch (e) {}
    }
  }

  // ---------- Spawning ----------
  function edgeSpawn() {
    const side = Math.floor(Math.random() * 4);
    if (side === 0) return { x: -30, y: Math.random() * H };
    if (side === 1) return { x: W + 30, y: Math.random() * H };
    if (side === 2) return { x: Math.random() * W, y: -30 };
    return { x: Math.random() * W, y: H + 30 };
  }

  function spawnEnemy() {
    const diff = Math.min(elapsed / 60, 1); // 0→1 over 60s
    const roll = Math.random();
    const pos = edgeSpawn();
    if (roll < 0.4) {
      const ang = Math.atan2(player.y - pos.y, player.x - pos.x) + (Math.random() - 0.5) * 0.6;
      const sp = 130 + diff * 160 + Math.random() * 60;
      enemies.push({ type: 'straight', x: pos.x, y: pos.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, r: 10, hue: 350 });
    } else if (roll < 0.7) {
      enemies.push({ type: 'chaser', x: pos.x, y: pos.y, vx: 0, vy: 0, sp: 80 + diff * 110, r: 12, hue: 10 });
    } else if (roll < 0.9) {
      const ang = Math.atan2(player.y - pos.y, player.x - pos.x);
      enemies.push({ type: 'zig', x: pos.x, y: pos.y, ang, sp: 110 + diff * 130, t: Math.random() * 6, r: 9, hue: 320 });
    } else {
      enemies.push({ type: 'tank', x: pos.x, y: pos.y, sp: 40 + diff * 45, r: 26, hue: 275 });
    }
  }

  function spawnStar() {
    const m = 70;
    stars.push({
      x: m + Math.random() * (W - m * 2),
      y: m + Math.random() * (H - m * 2),
      r: 9, t: 0, life: 7,
    });
  }

  function spawnPowerup() {
    const m = 80;
    powerups.push({
      x: m + Math.random() * (W - m * 2),
      y: m + Math.random() * (H - m * 2),
      r: 12, t: 0, life: 9,
    });
  }

  function burst(x, y, hue, n, sp) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = (Math.random() * 0.7 + 0.3) * sp;
      particles.push({
        x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        life: 1, decay: Math.random() * 1.5 + 1.2,
        r: Math.random() * 3 + 1.5, hue,
      });
    }
  }

  // ---------- Update ----------
  function update(dt) {
    for (const s of bgStars) {
      s.y += s.v * dt;
      if (s.y > H + 2) { s.y = -2; s.x = Math.random() * W; }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= (1 - 1.5 * dt); p.vy *= (1 - 1.5 * dt);
      p.life -= p.decay * dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    shake = Math.max(0, shake - dt * 30);
    flash = Math.max(0, flash - dt * 2.5);

    if (state !== STATE.PLAY) return;

    elapsed += dt;
    score += dt * 10 * (1 + combo * 0.1);

    if (mouse.x - player.x > 3) player.face = 1;
    else if (mouse.x - player.x < -3) player.face = -1;
    player.x += (mouse.x - player.x) * Math.min(1, dt * 14);
    player.y += (mouse.y - player.y) * Math.min(1, dt * 14);
    player.inv = Math.max(0, player.inv - dt);
    player.shield = Math.max(0, player.shield - dt);

    player.trail.unshift({ x: player.x, y: player.y });
    if (player.trail.length > 14) player.trail.pop();

    if (comboTimer > 0) {
      comboTimer -= dt;
      if (comboTimer <= 0) combo = 0;
    }

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnEnemy();
      const diff = Math.min(elapsed / 60, 1);
      spawnTimer = 1.1 - diff * 0.75 + Math.random() * 0.3;
    }
    starTimer -= dt;
    if (starTimer <= 0) { spawnStar(); starTimer = 2.2 + Math.random() * 1.5; }
    powerTimer -= dt;
    if (powerTimer <= 0) { spawnPowerup(); powerTimer = 14 + Math.random() * 8; }

    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      if (e.type === 'straight') {
        e.x += e.vx * dt; e.y += e.vy * dt;
      } else if (e.type === 'chaser') {
        const a = Math.atan2(player.y - e.y, player.x - e.x);
        e.vx += Math.cos(a) * 300 * dt;
        e.vy += Math.sin(a) * 300 * dt;
        const v = Math.hypot(e.vx, e.vy);
        if (v > e.sp) { e.vx = e.vx / v * e.sp; e.vy = e.vy / v * e.sp; }
        e.x += e.vx * dt; e.y += e.vy * dt;
      } else if (e.type === 'zig') {
        e.t += dt * 7;
        const perp = e.ang + Math.PI / 2;
        e.x += (Math.cos(e.ang) * e.sp + Math.cos(perp) * Math.sin(e.t) * 140) * dt;
        e.y += (Math.sin(e.ang) * e.sp + Math.sin(perp) * Math.sin(e.t) * 140) * dt;
      } else if (e.type === 'tank') {
        const a = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(a) * e.sp * dt;
        e.y += Math.sin(a) * e.sp * dt;
      }
      if (e.x < -120 || e.x > W + 120 || e.y < -120 || e.y > H + 120) {
        if (e.type === 'straight' || e.type === 'zig') { enemies.splice(i, 1); continue; }
      }
      const d = Math.hypot(e.x - player.x, e.y - player.y);
      if (d < e.r + player.r) {
        if (player.shield > 0) {
          player.shield = 0;
          burst(e.x, e.y, 190, 30, 300);
          enemies.splice(i, 1);
          sfx.shield();
          shake = 6;
          continue;
        }
        if (player.inv <= 0) {
          player.lives--;
          player.inv = 2;
          combo = 0;
          burst(player.x, player.y, 0, 40, 350);
          shake = 14; flash = 1;
          sfx.hit();
          enemies.splice(i, 1);
          if (player.lives <= 0) gameOver();
          continue;
        }
      }
    }

    for (let i = stars.length - 1; i >= 0; i--) {
      const s = stars[i];
      s.t += dt; s.life -= dt;
      if (s.life <= 0) { stars.splice(i, 1); continue; }
      const d = Math.hypot(s.x - player.x, s.y - player.y);
      if (d < 90) {
        const a = Math.atan2(player.y - s.y, player.x - s.x);
        const pull = (90 - d) * 8;
        s.x += Math.cos(a) * pull * dt;
        s.y += Math.sin(a) * pull * dt;
      }
      if (d < s.r + player.r + 4) {
        combo++;
        comboTimer = 3;
        maxCombo = Math.max(maxCombo, combo);
        starsCollected++;
        score += 100 * combo;
        burst(s.x, s.y, 48, 18, 260);
        sfx.star(combo);
        stars.splice(i, 1);
      }
    }

    for (let i = powerups.length - 1; i >= 0; i--) {
      const p = powerups[i];
      p.t += dt; p.life -= dt;
      if (p.life <= 0) { powerups.splice(i, 1); continue; }
      const d = Math.hypot(p.x - player.x, p.y - player.y);
      if (d < p.r + player.r + 4) {
        player.shield = 8;
        burst(p.x, p.y, 190, 24, 280);
        sfx.shield();
        powerups.splice(i, 1);
      }
    }
  }

  function gameOver() {
    state = STATE.OVER;
    sfx.over();
    shake = 20;
    const s = Math.floor(score);
    if (s > best) {
      best = s;
      try { localStorage.setItem('neon-duck-best', best); } catch (e) {}
    }
    fetchLeaderboard().then(() => {
      document.getElementById('hsEntry').style.display = isHighScore(s) ? 'block' : 'none';
    });
    document.getElementById('goScore').textContent = s.toLocaleString();
    document.getElementById('goTime').textContent = elapsed.toFixed(1);
    document.getElementById('goStars').textContent = starsCollected;
    document.getElementById('goCombo').textContent = maxCombo;
    document.getElementById('hsEntry').style.display = 'none';
    document.getElementById('hsSubmitted').style.display = 'none';
    let savedName = '';
    try { savedName = localStorage.getItem('neon-duck-name') || ''; } catch (e) {}
    document.getElementById('hsName').value = savedName;
    scoreSubmitted = false;
    setTimeout(() => document.getElementById('gameoverOverlay').classList.add('active'), 600);
  }

  // ---------- Draw ----------
  function glowCircle(x, y, r, color, blur) {
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = blur;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawDuck(x, y, r, dir, now) {
    const bob = Math.sin(now / 180) * r * 0.08;
    ctx.save();
    ctx.translate(x, y + bob);
    ctx.scale(dir, 1);
    ctx.shadowColor = '#ffd75d';
    ctx.shadowBlur = 24;
    ctx.fillStyle = '#ffd75d';
    // body
    ctx.beginPath();
    ctx.ellipse(0, r * 0.3, r * 1.15, r * 0.85, 0, 0, Math.PI * 2);
    ctx.fill();
    // tail
    ctx.beginPath();
    ctx.moveTo(-r * 0.9, r * 0.15);
    ctx.quadraticCurveTo(-r * 1.7, -r * 0.35, -r * 1.05, r * 0.6);
    ctx.closePath();
    ctx.fill();
    // head
    ctx.beginPath();
    ctx.arc(r * 0.55, -r * 0.55, r * 0.62, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    // beak
    ctx.fillStyle = '#ff9d2e';
    ctx.beginPath();
    ctx.moveTo(r * 1.05, -r * 0.62);
    ctx.lineTo(r * 1.68, -r * 0.42);
    ctx.lineTo(r * 1.05, -r * 0.26);
    ctx.closePath();
    ctx.fill();
    // eye
    ctx.fillStyle = '#1a1a2e';
    ctx.beginPath();
    ctx.arc(r * 0.7, -r * 0.68, r * 0.13, 0, Math.PI * 2);
    ctx.fill();
    // wing
    ctx.fillStyle = '#f0b93c';
    ctx.beginPath();
    ctx.ellipse(-r * 0.1, r * 0.3, r * 0.52, r * 0.34, -0.35, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawStarShape(x, y, r, rot) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const rr = i % 2 === 0 ? r : r * 0.45;
      const a = rot + i * Math.PI / 5 - Math.PI / 2;
      const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  function draw(now) {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    const grad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.75);
    grad.addColorStop(0, '#0d1026');
    grad.addColorStop(1, '#05050c');
    ctx.fillStyle = grad;
    ctx.fillRect(-30, -30, W + 60, H + 60);

    ctx.fillStyle = 'rgba(150, 190, 255, 0.5)';
    for (const s of bgStars) {
      ctx.globalAlpha = 0.25 + s.s * 0.3;
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    ctx.globalAlpha = 1;

    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      glowCircle(p.x, p.y, p.r, `hsl(${p.hue}, 100%, 65%)`, 12);
    }
    ctx.globalAlpha = 1;

    for (const s of stars) {
      const pulse = 1 + Math.sin(s.t * 5) * 0.12;
      const fade = s.life < 1.5 ? Math.max(0.15, s.life / 1.5) : 1;
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.shadowColor = '#ffd76b';
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#ffd76b';
      drawStarShape(s.x, s.y, s.r * pulse, s.t * 1.5);
      ctx.fill();
      ctx.restore();
    }

    for (const p of powerups) {
      const pulse = 1 + Math.sin(p.t * 4) * 0.15;
      const fade = p.life < 1.5 ? Math.max(0.15, p.life / 1.5) : 1;
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.strokeStyle = '#5df0ff';
      ctx.lineWidth = 2.5;
      ctx.shadowColor = '#5df0ff';
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * pulse, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 0.45 * pulse, 0, Math.PI * 2);
      ctx.fillStyle = '#5df0ff';
      ctx.fill();
      ctx.restore();
    }

    for (const e of enemies) {
      const col = `hsl(${e.hue}, 95%, 60%)`;
      if (e.type === 'tank') {
        ctx.save();
        ctx.shadowColor = col; ctx.shadowBlur = 24;
        ctx.strokeStyle = col; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = 'rgba(200, 80, 255, 0.25)';
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      } else {
        glowCircle(e.x, e.y, e.r, col, 18);
        glowCircle(e.x, e.y, e.r * 0.4, '#fff', 6);
      }
    }

    if (state === STATE.PLAY || state === STATE.OVER) {
      for (let i = 0; i < player.trail.length; i++) {
        const t = player.trail[i];
        const a = 1 - i / player.trail.length;
        ctx.globalAlpha = a * 0.3;
        glowCircle(t.x, t.y, player.r * a * 0.8, '#ffe9a0', 10);
      }
      ctx.globalAlpha = 1;

      if (state === STATE.PLAY) {
        const blinking = player.inv > 0 && Math.floor(now / 80) % 2 === 0;
        if (!blinking) {
          drawDuck(player.x, player.y, player.r * 1.1, player.face, now);
        }
        if (player.shield > 0) {
          ctx.save();
          ctx.strokeStyle = `rgba(93, 240, 255, ${player.shield < 2 ? (Math.sin(now / 60) * 0.3 + 0.5) : 0.8})`;
          ctx.lineWidth = 2.5;
          ctx.shadowColor = '#5df0ff'; ctx.shadowBlur = 14;
          ctx.beginPath();
          ctx.arc(player.x, player.y, player.r + 9, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
      }
    }

    if (state === STATE.PLAY) {
      ctx.save();
      ctx.font = '700 26px "Hiragino Kaku Gothic ProN", sans-serif';
      ctx.fillStyle = '#e8f6ff';
      ctx.shadowColor = 'rgba(93,240,255,0.7)'; ctx.shadowBlur = 12;
      ctx.textAlign = 'left';
      ctx.fillText(Math.floor(score).toLocaleString(), 24, 44);

      for (let i = 0; i < 3; i++) {
        ctx.globalAlpha = i < player.lives ? 1 : 0.18;
        glowCircle(W - 30 - i * 30, 36, 9, '#ff5d7a', 14);
      }
      ctx.globalAlpha = 1;

      if (combo > 1) {
        ctx.font = '800 22px sans-serif';
        ctx.fillStyle = '#ffd76b';
        ctx.shadowColor = '#ffd76b';
        ctx.textAlign = 'center';
        const cScale = 1 + Math.max(0, comboTimer - 2.7) * 3;
        ctx.save();
        ctx.translate(W / 2, 46);
        ctx.scale(cScale, cScale);
        ctx.fillText('COMBO x' + combo, 0, 0);
        ctx.restore();
        ctx.fillStyle = 'rgba(255, 215, 107, 0.8)';
        ctx.fillRect(W / 2 - 40, 56, 80 * (comboTimer / 3), 3);
      }
      ctx.restore();
    }

    ctx.restore();

    if (flash > 0) {
      ctx.fillStyle = `rgba(255, 60, 80, ${flash * 0.25})`;
      ctx.fillRect(0, 0, W, H);
    }

    if (state !== STATE.PLAY) {
      glowCircle(mouse.x, mouse.y, 6, '#5df0ff', 16);
    }
  }

  // ---------- Loop ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    draw(now);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
